# Render Blueprint: one free web service. Secrets use `sync: false`, so Render
# asks for their values when you create the Blueprint; they never live in git.
services:
  - type: web
    name: signal
    runtime: python
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python -m app.migrate
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CRON_TOKEN
        sync: false
      - key: PORTFOLIO_ORIGIN
        value: https://ebeetles.github.io
      - key: TIMEZONE
        value: America/New_York
